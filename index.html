<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campeonato Municipal</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ===== RESET E BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f5f7fa;
            color: #1e2a3a;
            padding: 20px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 1300px;
            width: 100%;
        }

        /* ===== HEADER ===== */
        .header {
            background: #fff;
            border-radius: 20px;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
            border-left: 6px solid #FFC107;
        }
        .logo {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .logo-icon {
            width: 60px;
            height: 60px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f0f4f8;
            border: 2px solid #e0ece2;
        }
        .logo-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 6px;
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #2E7D32;
            line-height: 1.2;
        }
        .logo span {
            font-size: 0.85rem;
            color: #6c7a8a;
            font-weight: 400;
            display: block;
        }
        .header-info {
            font-size: 0.85rem;
            color: #6c7a8a;
        }

        /* ===== TABS ===== */
        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            background: #fff;
            border-radius: 20px;
            padding: 6px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-bottom: 30px;
        }
        .tab-btn {
            padding: 14px 28px;
            border: none;
            border-radius: 40px;
            background: transparent;
            font-weight: 600;
            font-size: 0.95rem;
            color: #6c7a8a;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .tab-btn i { font-size: 1.1rem; }
        .tab-btn.active {
            background: #4CAF50;
            color: #fff;
            box-shadow: 0 4px 14px rgba(76,175,80,0.35);
        }
        .tab-btn:hover:not(.active) {
            background: #E8F5E9;
        }
        .tab-btn.live {
            background: #ff4757;
            color: #fff;
            animation: pulse-live 2s infinite;
        }
        @keyframes pulse-live {
            0% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 71, 87, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 71, 87, 0); }
        }

        /* ===== CONTENT ===== */
        .tab-content {
            display: none;
            animation: fadeUp 0.4s ease;
        }
        .tab-content.active { display: block; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== CARDS ===== */
        .card {
            background: #fff;
            border-radius: 20px;
            padding: 24px 28px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.08);
            margin-bottom: 24px;
            border-top: 4px solid #FFC107;
        }
        .card-title {
            font-size: 1.3rem;
            font-weight: 700;
            color: #2E7D32;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .card-title i { color: #FFC107; }

        /* ===== TABELA CLASSIFICAÇÃO ===== */
        .table-wrap { overflow-x: auto; }
        .table-wrap table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
            min-width: 700px;
        }
        .table-wrap th {
            text-align: center;
            padding: 10px 6px;
            font-weight: 700;
            text-transform: uppercase;
            font-size: 0.65rem;
            letter-spacing: 0.5px;
            color: #2E7D32;
            border-bottom: 2px solid #FFC107;
            background: #f8fdf9;
        }
        .table-wrap td {
            text-align: center;
            padding: 10px 6px;
            border-bottom: 1px solid #e9ecef;
            vertical-align: middle;
        }
        .table-wrap tr:last-child td { border-bottom: none; }
        .table-wrap tr:hover td { background: #f8fdf9; }
        .table-wrap .team-cell {
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
        }
        .table-wrap .team-badge {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f0f4f8;
            border: 2px solid #e0ece2;
            flex-shrink: 0;
        }
        .table-wrap .team-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 2px;
        }
        .table-wrap .team-badge .fallback {
            font-weight: 700;
            font-size: 0.6rem;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.3);
        }
        .table-wrap .seta { font-size: 0.9rem; margin-left: 4px; }
        .table-wrap .seta-up { color: #27ae60; }
        .table-wrap .seta-down { color: #e74c3c; }
        .table-wrap .seta-igual { color: #f39c12; }
        .table-wrap .pos-1 { background: #FFF8E1; font-weight: 800; }
        .table-wrap .grupo-titulo {
            background: #2E7D32;
            color: #fff;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 8px 16px;
            border-radius: 8px;
            margin: 16px 0 8px 0;
            display: inline-block;
        }
        .table-wrap .grupo-header { background: #E8F5E9; border-bottom: 2px solid #4CAF50; }
        .table-wrap .grupo-header th { background: #E8F5E9; color: #2E7D32; font-size: 0.8rem; padding: 12px 6px; }

        /* ===== MATA-MATA ===== */
        .mata-mata-container { display: flex; flex-direction: column; gap: 30px; padding: 10px 0; }
        .mata-mata-round {
            background: #f8fdf9;
            border-radius: 16px;
            padding: 20px 24px;
            border: 2px solid #e0ece2;
        }
        .mata-mata-round h3 {
            color: #2E7D32;
            font-size: 1.1rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .mata-mata-round h3 i { color: #FFC107; }
        .mata-mata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }
        .mata-mata-match {
            background: #fff;
            border-radius: 12px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-left: 4px solid #4CAF50;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            transition: 0.2s;
        }
        .mata-mata-match:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 16px rgba(0,0,0,0.10);
        }
        .mata-mata-match .match-teams { display: flex; flex-direction: column; gap: 4px; flex: 1; }
        .mata-mata-match .match-teams .team-row {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        .mata-mata-match .match-teams .team-row .mini-badge {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: #f0f4f8;
            border: 1px solid #ddd;
            flex-shrink: 0;
        }
        .mata-mata-match .match-teams .team-row .mini-badge img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 2px;
        }
        .mata-mata-match .match-teams .team-row .mini-badge .fallback {
            font-weight: 700;
            font-size: 0.5rem;
            color: #fff;
        }
        .mata-mata-match .match-placar {
            font-weight: 800;
            font-size: 1.2rem;
            color: #2E7D32;
            background: #E8F5E9;
            padding: 4px 16px;
            border-radius: 40px;
            min-width: 60px;
            text-align: center;
        }
        .mata-mata-empty {
            text-align: center;
            padding: 40px 20px;
            color: #6c7a8a;
        }
        .mata-mata-empty i { font-size: 3rem; color: #ddd; margin-bottom: 12px; }

        /* ===== CARTÕES ===== */
        .cards-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .card-item {
            background: #f8fdf9;
            border-radius: 14px;
            padding: 14px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-left: 5px solid #FFC107;
            transition: 0.2s;
        }
        .card-item:hover {
            background: #eef7f0;
            transform: translateX(4px);
        }
        .card-item .card-info {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .card-item .card-player {
            font-weight: 600;
            font-size: 1rem;
        }
        .card-item .card-team {
            font-size: 0.85rem;
            color: #6c7a8a;
        }
        .card-item .card-type {
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 40px;
            font-size: 0.8rem;
        }
        .card-item .card-type.amarillo {
            background: #FFF8E1;
            color: #f39c12;
            border: 2px solid #f39c12;
        }
        .card-item .card-type.vermelho {
            background: #FFEBEE;
            color: #e74c3c;
            border: 2px solid #e74c3c;
        }
        .card-item .card-detail {
            color: #6c7a8a;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .card-stats {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
            margin-top: 16px;
        }
        .card-stat-box {
            background: #f8fdf9;
            border-radius: 14px;
            padding: 14px 18px;
            text-align: center;
            border: 1px solid #e0ece2;
        }
        .card-stat-box .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: #2E7D32;
        }
        .card-stat-box .stat-label {
            font-size: 0.8rem;
            color: #6c7a8a;
        }
        .card-stat-box.amarillo .stat-number { color: #f39c12; }
        .card-stat-box.vermelho .stat-number { color: #e74c3c; }

        /* ===== AO VIVO ===== */
        .live-match {
            background: linear-gradient(135deg, #ff4757 0%, #ff6b81 100%);
            border-radius: 20px;
            padding: 28px 32px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            box-shadow: 0 8px 30px rgba(255, 71, 87, 0.25);
            margin-bottom: 24px;
        }
        .live-match .live-badge {
            background: rgba(255,255,255,0.2);
            padding: 6px 18px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .live-match .live-badge .dot {
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        .live-match .teams {
            display: flex;
            align-items: center;
            gap: 24px;
            font-weight: 700;
            font-size: 1.4rem;
        }
        .live-match .teams .vs { font-size: 0.9rem; opacity: 0.6; }
        .live-match .score {
            font-size: 2.5rem;
            font-weight: 900;
            background: rgba(255,255,255,0.15);
            padding: 4px 24px;
            border-radius: 16px;
        }
        .live-match .match-info {
            font-size: 0.8rem;
            opacity: 0.8;
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }
        .live-empty {
            text-align: center;
            padding: 40px 20px;
            color: #6c7a8a;
        }
        .live-empty i { font-size: 3rem; color: #ddd; margin-bottom: 12px; }
        .live-empty h3 { font-size: 1.2rem; color: #37474F; margin-bottom: 8px; }

        /* ===== MATCH LIST ===== */
        .match-item {
            background: #f8fdf9;
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            border-left: 5px solid #FFC107;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        .match-item:hover { background: #eef7f0; transform: translateX(4px); }
        .match-info {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .match-teams { font-weight: 600; font-size: 1rem; }
        .match-score {
            font-weight: 700;
            font-size: 1.2rem;
            color: #2E7D32;
            background: #FFF8E1;
            padding: 2px 14px;
            border-radius: 40px;
        }
        .match-detail {
            color: #6c7a8a;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        /* ===== SCORERS ===== */
        .scorers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 14px;
        }
        .scorer-card {
            background: #f8fdf9;
            border-radius: 14px;
            padding: 14px 18px;
            display: flex;
            align-items: center;
            gap: 14px;
            border: 1px solid #e0ece2;
            transition: 0.2s;
        }
        .scorer-card:hover {
            background: #eef7f0;
            transform: translateY(-3px);
            box-shadow: 0 6px 16px rgba(76,175,80,0.12);
        }
        .scorer-pos {
            font-weight: 700;
            color: #F9A825;
            font-size: 1.1rem;
            min-width: 30px;
        }
        .scorer-name { font-weight: 600; }
        .scorer-team { font-size: 0.8rem; color: #6c7a8a; }
        .scorer-goals {
            margin-left: auto;
            background: #4CAF50;
            color: #fff;
            padding: 2px 16px;
            border-radius: 40px;
            font-weight: 700;
            font-size: 0.9rem;
        }

        /* ===== RESPONSIVO ===== */
        @media (max-width: 768px) {
            .header { padding: 16px 18px; }
            .logo h1 { font-size: 1.3rem; }
            .logo-icon { width: 48px; height: 48px; }
            .tab-btn { padding: 10px 16px; font-size: 0.8rem; }
            .card { padding: 16px; }
            .match-info { flex-direction: column; align-items: flex-start; gap: 6px; }
            .table-wrap table { font-size: 0.7rem; min-width: 500px; }
            .table-wrap th, .table-wrap td { padding: 6px 4px; }
            .live-match { padding: 20px; }
            .live-match .teams { font-size: 1.1rem; gap: 12px; }
            .live-match .score { font-size: 1.8rem; padding: 4px 16px; }
            .mata-mata-grid { grid-template-columns: 1fr; }
            .mata-mata-match { flex-direction: column; align-items: stretch; gap: 12px; }
            .mata-mata-match .match-placar { align-self: flex-start; }
        }
        @media (max-width: 480px) {
            body { padding: 10px; }
            .table-wrap table { font-size: 0.6rem; min-width: 400px; }
            .table-wrap th, .table-wrap td { padding: 4px 2px; }
            .table-wrap .team-badge { width: 20px; height: 20px; }
            .mata-mata-match { padding: 12px 14px; }
            .mata-mata-match .match-teams .team-row { font-size: 0.8rem; }
        }
    </style>
</head>
<body>
<div class="container">

    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="logo">
            <div class="logo-icon">
                <img src="images/prefeitura.png" alt="Prefeitura" id="prefeituraLogo" />
            </div>
            <div>
                <h1>Campeonato Municipal</h1>
                <span>Prefeitura · Temporada 2026</span>
            </div>
        </div>
        <div class="header-info">
            <i class="fas fa-calendar-alt"></i> Atualizado: <span id="updateDate"></span>
        </div>
    </header>

    <!-- ===== TABS ===== -->
    <div class="tabs">
        <button class="tab-btn active" data-tab="tab-classificacao"><i class="fas fa-trophy"></i> Classificação</button>
        <button class="tab-btn" data-tab="tab-ao-vivo"><i class="fas fa-broadcast-tower"></i> Ao Vivo</button>
        <button class="tab-btn" data-tab="tab-mata-mata"><i class="fas fa-flag-checkered"></i> Mata-Mata</button>
        <button class="tab-btn" data-tab="tab-jogos"><i class="fas fa-calendar-check"></i> Jogos</button>
        <button class="tab-btn" data-tab="tab-cartoes"><i class="fas fa-card"></i> Cartões</button>
        <button class="tab-btn" data-tab="tab-artilheiros"><i class="fas fa-user-plus"></i> Artilheiros</button>
    </div>

    <!-- ===== TAB CLASSIFICAÇÃO ===== -->
    <div id="tab-classificacao" class="tab-content active">
        <div class="card">
            <div class="card-title"><i class="fas fa-list-ol"></i> Tabela de Classificação</div>
            <div class="table-wrap" id="standingsContainer"></div>
        </div>
    </div>

    <!-- ===== TAB AO VIVO ===== -->
    <div id="tab-ao-vivo" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fas fa-broadcast-tower" style="color:#ff4757;"></i> Jogos ao Vivo</div>
            <div id="liveMatchesContainer"></div>
        </div>
    </div>

    <!-- ===== TAB MATA-MATA ===== -->
    <div id="tab-mata-mata" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fas fa-flag-checkered"></i> Fase Mata-Mata</div>
            <div id="mataMataContainer"></div>
        </div>
    </div>

    <!-- ===== TAB JOGOS ===== -->
    <div id="tab-jogos" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fas fa-clock"></i> Próximos Jogos</div>
            <div id="upcomingMatches" class="match-list"></div>
        </div>
        <div class="card">
            <div class="card-title"><i class="fas fa-check-circle"></i> Jogos Realizados</div>
            <div id="playedMatches" class="match-list"></div>
        </div>
    </div>

    <!-- ===== TAB CARTÕES ===== -->
    <div id="tab-cartoes" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fas fa-card" style="color:#f39c12;"></i> Cartões do Campeonato</div>
            
            <!-- Estatísticas de cartões -->
            <div class="card-stats" id="cardStats"></div>
            
            <!-- Lista de cartões -->
            <div style="margin-top:20px;">
                <h4 style="color:#2E7D32; margin-bottom:12px;">📋 Registro de Cartões</h4>
                <div id="cardsList" class="cards-list"></div>
            </div>
        </div>
    </div>

    <!-- ===== TAB ARTILHEIROS ===== -->
    <div id="tab-artilheiros" class="tab-content">
        <div class="card">
            <div class="card-title"><i class="fas fa-fire"></i> Artilheiros do Campeonato</div>
            <div id="scorersList" class="scorers-grid"></div>
        </div>
    </div>

</div>

<script>
    // ================================================================
    //  BANCO DE DADOS (localStorage)
    // ================================================================
    const STORAGE_KEY = 'campeonato_municipal_data';

    function getDefaultData() {
        return {
            teams: [
                { id: 't1', name: 'OBRAS', badge: 'OBR', color: '#d62828', logo: 'images/obras.png', group: 'A' },
                { id: 't2', name: 'LIMOEIRO', badge: 'LIM', color: '#1a7a3a', logo: 'images/limoeiro.png', group: 'A' },
                { id: 't3', name: 'BUJARU', badge: 'BUJ', color: '#231f20', logo: 'images/bujaru.png', group: 'A' },
                { id: 't4', name: 'LUCRISCAR', badge: 'LUC', color: '#c52b2b', logo: 'images/lucriscar.png', group: 'A' },
                { id: 't5', name: 'CRUZEIRO', badge: 'CRU', color: '#000000', logo: 'images/cruzeiro.png', group: 'A' },
                { id: 't6', name: 'INDUSTRIAL', badge: 'IND', color: '#e01a2f', logo: 'images/industrial.png', group: 'A' },
                { id: 't7', name: 'SHOUSE', badge: 'SHO', color: '#8e44ad', logo: 'images/shouser.png', group: 'A' },
                { id: 't8', name: 'ESMAC', badge: 'ESM', color: '#2980b9', logo: 'images/esmac.png', group: 'B' },
                { id: 't9', name: 'CLUBE DO REMO', badge: 'REM', color: '#27ae60', logo: 'images/remo.png', group: 'B' },

    function loadData() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try {
                const data = JSON.parse(raw);
                if (!data.teams) data.teams = [];
                if (!data.matches) data.matches = [];
                if (!data.scorers) data.scorers = [];
                if (!data.cards) data.cards = [];
                if (!data.mataMata) data.mataMata = getDefaultData().mataMata;
                return data;
            } catch (e) { return getDefaultData(); }
        }
        return getDefaultData();
    }

    let data = loadData();

    // ================================================================
    //  FUNÇÕES AUXILIARES
    // ================================================================
    function getTeam(id) { return data.teams.find(t => t.id === id); }
    function getTeamName(id) { const t = getTeam(id); return t ? t.name : '?'; }
    function getTeamBadge(id) { const t = getTeam(id); return t ? t.badge : '?'; }
    function getTeamColor(id) { const t = getTeam(id); return t ? t.color : '#2a3f52'; }
    function getTeamLogo(id) { const t = getTeam(id); return t && t.logo ? t.logo : null; }
    function getTeamGroup(id) { const t = getTeam(id); return t ? t.group : null; }
    function formatDate(dt) {
        if (!dt) return '—';
        const d = new Date(dt);
        return d.toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
    }
    function timeAgo(dt) {
        if (!dt) return '—';
        const now = new Date();
        const past = new Date(dt);
        const diff = Math.floor((now - past) / 1000);
        if (diff < 60) return 'Agora mesmo';
        if (diff < 3600) return `${Math.floor(diff / 60)} min atrás`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}h atrás`;
        return formatDate(dt);
    }

    // ================================================================
    //  CÁLCULO DA CLASSIFICAÇÃO
    // ================================================================
    function calculateStandings() {
        const groups = ['A', 'B'];
        const result = {};
        groups.forEach(g => {
            const teamsInGroup = data.teams.filter(t => t.group === g);
            const map = {};
            teamsInGroup.forEach(t => {
                map[t.id] = {
                    id: t.id, name: t.name, badge: t.badge, color: t.color,
                    logo: t.logo, group: t.group, posicao: '—',
                    j: 0, v: 0, e: 0, d: 0, gp: 0, gc: 0, sg: 0, pts: 0,
                    aproveitamento: 0, pe: 0
                };
            });
            data.matches.forEach(m => {
                if (!m.played) return;
                const home = map[m.homeTeamId];
                const away = map[m.awayTeamId];
                if (!home || !away) return;
                const hg = m.homeGoals || 0;
                const ag = m.awayGoals || 0;
                home.j += 1; away.j += 1;
                home.gp += hg; home.gc += ag;
                away.gp += ag; away.gc += hg;
                if (hg > ag) { home.v += 1; away.d += 1; home.pts += 3; }
                else if (hg < ag) { away.v += 1; home.d += 1; away.pts += 3; }
                else { home.e += 1; away.e += 1; home.pts += 1; away.pts += 1; }
                home.sg = home.gp - home.gc;
                away.sg = away.gp - away.gc;
            });
            Object.values(map).forEach(team => {
                const totalJogos = team.j || 1;
                team.aproveitamento = Math.round((team.pts / (totalJogos * 3)) * 100);
                team.pe = 0;
            });
            const sorted = Object.values(map);
            sorted.sort((a, b) => {
                if (a.pts !== b.pts) return b.pts - a.pts;
                if (a.sg !== b.sg) return b.sg - a.sg;
                if (a.gp !== b.gp) return b.gp - a.gp;
                return a.name.localeCompare(b.name);
            });
            sorted.forEach((team, idx) => { team.posicao = idx + 1; });
            result[g] = sorted;
        });
        return result;
    }

    function renderStandings() {

        ['A', 'B'].forEach(g => {
            const teams = standings[g] || [];
            html += `
                <div style="margin-bottom:24px;">
                    <div class="grupo-titulo">🏆 GRUPO ${g}</div>
                    <table>
                        <thead class="grupo-header">
                            <tr>
                                <th style="width:40px;">Pos</th>
                                <th style="text-align:left;min-width:140px;">EQUIPES</th>
                                <th style="width:30px;">P</th><th style="width:30px;">J</th>
                                <th style="width:30px;">V</th><th style="width:30px;">E</th><th style="width:30px;">D</th>
                                <th style="width:30px;">GP</th><th style="width:30px;">GC</th>
                                <th style="width:35px;">SG</th><th style="width:40px;">%</th><th style="width:30px;">PE</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            const arrows = ['—', '—', '↑', '↑', '↓', '—', '—'];
            teams.forEach((team, idx) => {
                const pos = idx + 1;
                let seta = arrows[idx] || '—';
                let setaClass = 'seta-igual';
                if (seta === '↑') setaClass = 'seta-up';
                else if (seta === '↓') setaClass = 'seta-down';
                const logo = getTeamLogo(team.id);
                const badgeHtml = logo ? 
                    `<img src="${logo}" alt="${team.badge}" />` : 
                    `<span class="fallback" style="background:${team.color || '#2a3f52'};">${team.badge}</span>`;
                html += `
                    <tr class="${pos <= 3 ? 'pos-1' : ''}">
                        <td style="font-weight:700;text-align:center;">
                            ${pos}<span class="seta ${setaClass}">${seta}</span>
                        </td>
                        <td style="text-align:left;">

                        <td>${team.pts}</td><td>${team.j}</td>

                        <td>${team.gp}</td><td>${team.gc}</td>
                        <td>${team.sg}</td><td>${team.aproveitamento}</td><td>${team.pe}</td>
                    </tr>
                `;
            });
            html += `</tbody></table></div>`;
        });
        container.innerHTML = html;
    }

                <div class="card-info">
                    <span class="card-player">${card.playerName}</span>
                    <span class="card-team">(${team ? team.name : '?'})</span>
                    <span class="card-type ${card.type === 'amarelo' ? 'amarillo' : 'vermelho'}">
                        ${card.type === 'amarelo' ? '🟨 Amarelo' : '🟥 Vermelho'}
                    </span>
                    <span class="card-detail"><i class="far fa-calendar-alt"></i> ${formatDate(card.datetime)}</span>
                </div>
            `;
            container.appendChild(div);
        });
    }

    function renderScorers() {
        const container = document.getElementById('scorersList');
        container.innerHTML = '';
        if (data.scorers.length === 0) {
            container.innerHTML = '<p style="color:#6c7a8a;">Nenhum gol registrado ainda.</p>';
            return;
        }
        const sorted = [...data.scorers].sort((a, b) => b.goals - a.goals);
        sorted.forEach((item, idx) => {
            const div = document.createElement('div');
            div.className = 'scorer-card';
            div.innerHTML = `
                <span class="scorer-pos">#${idx+1}</span>
                <span class="scorer-name">${item.playerName}</span>
                <span class="scorer-team">(${getTeamName(item.teamId)})</span>
                <span class="scorer-goals">${item.goals}</span>
            `;
            container.appendChild(div);
        });
    }

    function renderAll() {
        renderStandings();
        renderLiveMatches();
        renderMataMata();
        renderMatches();
        renderCards();
        renderScorers();
    }

    // ================================================================
    //  TABS
    // ================================================================
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    // ================================================================
    //  DATA DE ATUALIZAÇÃO
    // ================================================================
    document.getElementById('updateDate').textContent = new Date().toLocaleDateString('pt-BR', {
        day: '2-digit', month: 'long', year: 'numeric'
    });

    // ================================================================
    //  INICIALIZAÇÃO
    // ================================================================
    renderAll();

    setInterval(() => {
        data = loadData();
        renderLiveMatches();
        renderMataMata();
        renderCards();
    }, 30000);

    window.addEventListener('storage', (e) => {
        if (e.key === STORAGE_KEY) {
            data = loadData();
            renderAll();
        }
    });
</script>
</body>
</html>
